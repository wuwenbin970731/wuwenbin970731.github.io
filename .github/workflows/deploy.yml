name: Deploy site

on:
  # 每次推送到 `main` 分支时触发这个“工作流程”
  # 如果你使用了别的分支名，请按需将 `main` 替换成你的分支名
  push:
    branches: [ main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此“工作流程”
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

# 允许 job 克隆 repo 并创建一个 page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --registry=https://registry.npmjs.org/
      - name: Verify Astro binary
        run: |
          node --version
          npm --version
          npm ls astro
          test -x node_modules/.bin/astro
      - name: Build site
        run: |
          npx --no-install astro check
          npx --no-install astro build
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aliyun-oss:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: aliyun-oss
    env:
      OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
      OSS_BUCKET: hexo-blog-wuwenbin
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID || secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET || secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_REGION_ID: cn-beijing
      ALIYUN_CDN_REFRESH_URLS: ${{ vars.ALIYUN_CDN_REFRESH_URLS }}
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Validate Aliyun configuration
        run: |
          test -n "$OSS_ENDPOINT"
          test -n "$OSS_BUCKET"
          test -n "$ALIYUN_ACCESS_KEY_ID"
          test -n "$ALIYUN_ACCESS_KEY_SECRET"

      - name: Install and configure ossutil v2
        run: |
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip -q ossutil.zip
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/
          chmod +x /usr/local/bin/ossutil
          ossutil version

          OSS_ENDPOINT_VALUE="${OSS_ENDPOINT#http://}"
          OSS_ENDPOINT_VALUE="${OSS_ENDPOINT_VALUE#https://}"
          OSS_REGION_VALUE="$(printf '%s' "$OSS_ENDPOINT_VALUE" | sed -E 's#^oss-([a-z0-9-]+)(-internal)?\.aliyuncs\.com$#\1#')"
          if [ "$OSS_REGION_VALUE" = "$OSS_ENDPOINT_VALUE" ]; then
            OSS_REGION_VALUE="${ALIYUN_REGION_ID:-cn-beijing}"
          fi
          echo "Using OSS endpoint: $OSS_ENDPOINT_VALUE"
          echo "Using OSS region: $OSS_REGION_VALUE"
          echo "OSS_ENDPOINT_VALUE=$OSS_ENDPOINT_VALUE" >> "$GITHUB_ENV"
          echo "OSS_REGION_VALUE=$OSS_REGION_VALUE" >> "$GITHUB_ENV"
          cat > ~/.ossutilconfig << EOF
          [Credentials]
          accessKeyID=$ALIYUN_ACCESS_KEY_ID
          accessKeySecret=$ALIYUN_ACCESS_KEY_SECRET
          region=$OSS_REGION_VALUE
          [Endpoint]
          endpoint=$OSS_ENDPOINT_VALUE
          EOF

      - name: Upload dist to Aliyun OSS
        run: |
          OSS_BUCKET_NAME="${OSS_BUCKET#oss://}"
          OSS_BUCKET_NAME="${OSS_BUCKET_NAME%/}"
          echo "Using OSS bucket: $OSS_BUCKET_NAME"
          timeout 300s ossutil sync dist/ "oss://$OSS_BUCKET_NAME/" --delete --force --region "$OSS_REGION_VALUE"

          find dist -type f -name index.html | while IFS= read -r index_file; do
            route="${index_file#dist/}"
            route="${route%/index.html}"
            [ -n "$route" ] || continue
            redirect_url="/$route/"
            cat > .oss-redirect.html << EOF
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0;url=$redirect_url">
              <link rel="canonical" href="$redirect_url">
              <script>location.replace("$redirect_url")</script>
            </head>
            <body><a href="$redirect_url">Redirecting to $redirect_url</a></body>
          </html>
          EOF
            ossutil cp .oss-redirect.html "oss://$OSS_BUCKET_NAME/$route" --force --region "$OSS_REGION_VALUE"
          done
          rm -f .oss-redirect.html

      - name: Refresh Aliyun CDN
        if: ${{ vars.ALIYUN_CDN_REFRESH_URLS != '' }}
        run: |
          curl -fsSL -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "${ALIYUN_REGION_ID:-cn-hangzhou}" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "$ALIYUN_CDN_REFRESH_URLS" \
            --ObjectType Directory || {
              echo "::warning::Aliyun CDN refresh failed, but OSS deployment has completed."
            }
