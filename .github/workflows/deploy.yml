name: Deploy site

on:
  # 每次推送到 `main` 分支时触发这个“工作流程”
  # 如果你使用了别的分支名，请按需将 `main` 替换成你的分支名
  push:
    branches: [ main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此“工作流程”
  workflow_dispatch:

# 允许 job 克隆 repo 并创建一个 page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --registry=https://registry.npmjs.org/
      - name: Verify Astro binary
        run: |
          node --version
          npm --version
          npm ls astro
          test -x node_modules/.bin/astro
      - name: Build site
        run: |
          npx --no-install astro check
          npx --no-install astro build
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aliyun-oss:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aliyun-oss
    env:
      OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_REGION_ID: ${{ vars.ALIYUN_REGION_ID }}
      ALIYUN_CDN_REFRESH_URLS: ${{ vars.ALIYUN_CDN_REFRESH_URLS }}
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Validate Aliyun configuration
        run: |
          test -n "$OSS_ENDPOINT"
          test -n "$OSS_BUCKET"
          test -n "$ALIYUN_ACCESS_KEY_ID"
          test -n "$ALIYUN_ACCESS_KEY_SECRET"

      - name: Install ossutil
        run: |
          curl -fsSL -o ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil64

      - name: Upload dist to Aliyun OSS
        run: |
          OSS_BUCKET_NAME="${OSS_BUCKET#oss://}"
          OSS_BUCKET_NAME="${OSS_BUCKET_NAME%/}"
          ossutil64 config \
            -e "$OSS_ENDPOINT" \
            -i "$ALIYUN_ACCESS_KEY_ID" \
            -k "$ALIYUN_ACCESS_KEY_SECRET" \
            -L CH \
            -c .ossutilconfig
          ossutil64 cp -r dist/ "oss://$OSS_BUCKET_NAME/" -f -c .ossutilconfig

      - name: Refresh Aliyun CDN
        if: ${{ vars.ALIYUN_CDN_REFRESH_URLS != '' }}
        run: |
          curl -fsSL -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun configure set \
            --profile default \
            --mode AK \
            --region "${ALIYUN_REGION_ID:-cn-hangzhou}" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "$ALIYUN_CDN_REFRESH_URLS" \
            --ObjectType Directory
